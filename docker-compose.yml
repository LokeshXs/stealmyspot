services:
  postgres:
    image: postgres:17-alpine
    container_name: outbid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: outbid
      POSTGRES_PASSWORD: outbid
      POSTGRES_DB: outbid
    ports:
      - "5432:5432"
    volumes:
      - outbid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbid -d outbid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  outbid-pgdata:
